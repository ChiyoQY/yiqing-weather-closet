<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#dfe9e1" />
    <meta name="description" content="根据未来天气和你的衣橱给出每日穿搭建议。" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>:root { --ink:#20241f; --muted:#72776f; --sage:#dce8dc; --sage-deep:#55725c; --cream:#faf8f3; --peach:#f5ddd1; --line:#e7e3da; --white:#fffefa; --shadow:0 12px 32px rgba(44,50,38,.08); }
* { box-sizing:border-box; } body { margin:0; color:var(--ink); background:#eef1ea; font-family:Manrope,"Noto Sans SC",sans-serif; } button,input,select { font:inherit; } button { border:0; cursor:pointer; } .app-shell { min-height:100vh; max-width:560px; margin:auto; position:relative; background:var(--cream); padding:28px 20px 104px; overflow:hidden; } .view { display:none; animation:fade .25s ease; } .view.active { display:block; } @keyframes fade { from{opacity:.3; transform:translateY(6px)}to{opacity:1;transform:none} }
.location-tools{margin:10px 0 2px}.city-search-label{margin:0;color:#46644b;font-size:11px;font-weight:800}.city-search{display:flex;gap:7px;margin-top:7px}.city-search input{min-width:0;flex:1;padding:8px 10px;border:1px solid #91a78f;border-radius:10px;background:#fffdf8;font-size:12px;outline-color:#55725c}.city-search button{border-radius:10px;padding:0 12px;background:#55725c;color:#fff;font-size:12px;font-weight:700}.location-action-row{display:flex;align-items:center;gap:8px;margin-top:9px}.use-location-button{padding:6px 9px;border-radius:8px;background:#edf4e9;color:#46644b;font-size:11px;font-weight:800}.location-action-row span{font-size:10px;color:#5e705e}.city-results{display:grid;gap:5px;margin-top:7px}.city-result{width:100%;text-align:left;background:#fffdfa;border:1px solid #c7d4c3;border-radius:9px;padding:8px 10px;color:#405243;font-size:11px}.city-result b{font-size:12px}.city-result span{margin-left:5px;opacity:.74}
</style>
    <title>衣晴 · 我的天气衣橱</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="view active" id="homeView" aria-labelledby="homeTitle">
        <header class="topbar">
          <div>
            <p class="eyebrow">你的智能衣橱</p>
            <h1 id="homeTitle">衣晴</h1>
          </div>
          <button class="avatar" id="locationButton" aria-label="更新当前位置">⌖</button>
        </header>

        <section class="weather-card" aria-live="polite">
          <div class="weather-meta"><span id="locationName">上海</span><span id="updatedAt">正在获取天气</span></div>
          <div class="location-tools">
            <p class="city-search-label">选择城市查看天气与搭配</p>
            <form class="city-search" id="citySearchForm">
              <input id="citySearchInput" type="search" autocomplete="off" placeholder="输入城市，例如：杭州、Tokyo" aria-label="搜索城市" />
              <button type="submit">搜索</button>
            </form>
            <div class="location-action-row"><button class="use-location-button" id="locationActionButton" type="button">⌖ 使用我的当前位置</button><span>首次使用请在浏览器弹窗中允许定位</span></div>
            <div class="city-results" id="cityResults" aria-live="polite"></div>
          </div>
          <div class="weather-main"><span class="weather-icon" id="weatherIcon">☀</span><strong id="currentTemp">26°</strong><div><b id="weatherStatus">晴朗</b><span id="feelsLike">体感 26°</span></div></div>
          <p id="weatherSummary">今天适合轻盈、透气的搭配。</p>
          <div class="weather-details"><span>💧 <b id="rainChance">10%</b> 降雨</span><span>↝ <b id="windSpeed">12 km/h</b></span><span>☀ <b id="uvIndex">6</b> 紫外线</span></div>
        </section>

        <section class="section-heading"><div><p class="eyebrow">未来 10 天</p><h2>为每一天准备</h2></div><button class="text-button" id="refreshWeather">刷新</button></section>
        <div class="forecast-strip" id="forecastStrip" aria-label="未来十天天气预报"></div>

        <section class="section-heading recommendation-title"><div><p class="eyebrow" id="selectedDateLabel">今日推荐</p><h2>这样穿，刚刚好</h2></div><button class="round-button" id="shuffleOutfit" aria-label="换一套推荐">↻</button></section>
        <section class="recommendation-card" id="recommendationCard">
          <div class="look-preview" id="lookPreview"><span>衣</span></div>
          <div class="recommendation-copy"><span class="occasion-chip" id="comfortChip">舒适通勤</span><h3 id="outfitTitle">轻盈层次感</h3><p id="outfitReason">根据温度与衣橱挑选中…</p><button class="link-button" id="viewPieces">查看这套单品 →</button></div>
        </section>
        <aside class="tip-card"><span>✦</span><p id="styleTip">小提示：温差较大时，带上一件薄外套更从容。</p></aside>
      </section>

      <section class="view" id="closetView" aria-labelledby="closetTitle">
        <header class="topbar"><div><p class="eyebrow">我的衣橱</p><h1 id="closetTitle">所有单品</h1></div><button class="add-shortcut" data-goto="addView">＋ 添加</button></header>
        <div class="closet-stats"><span><b id="activeCount">0</b> 件在架</span><span><b id="archivedCount">0</b> 件已下架</span></div>
        <div class="filter-row" id="filterRow"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="top">上装</button><button class="filter" data-filter="bottom">下装</button><button class="filter" data-filter="outer">外套</button><button class="filter" data-filter="shoe">鞋履</button></div>
        <div class="closet-grid" id="closetGrid"></div>
      </section>

      <section class="view" id="addView" aria-labelledby="addTitle">
        <header class="topbar"><div><p class="eyebrow">持续丰富你的衣橱</p><h1 id="addTitle">添加单品</h1></div></header>
        <form id="itemForm" class="item-form">
          <label class="photo-picker" id="photoPicker"><input type="file" id="itemPhoto" accept="image/*" /><span class="photo-plus">＋</span><b>上传衣物照片</b><small>支持相册或拍照</small></label>
          <label>单品名称<input required id="itemName" maxlength="28" placeholder="例如：米白色针织开衫" /></label>
          <div class="form-two"><label>类别<select id="itemCategory"><option value="top">上装</option><option value="bottom">下装</option><option value="outer">外套</option><option value="shoe">鞋履</option><option value="dress">连衣裙</option><option value="accessory">配饰</option></select></label><label>主色<select id="itemColor"><option>米白</option><option>黑色</option><option>蓝色</option><option>棕色</option><option>绿色</option><option>粉色</option><option>灰色</option><option>彩色</option></select></label></div>
          <label>保暖程度 <output id="warmthOutput">中等</output><input type="range" id="itemWarmth" min="1" max="5" value="3" /></label>
          <label>适合场景<input id="itemOccasion" maxlength="20" placeholder="例如：通勤、休闲、约会" /></label>
          <button class="primary-button" type="submit">保存到衣橱</button>
        </form>
      </section>

      <nav class="bottom-nav" aria-label="主导航"><button class="nav-item active" data-goto="homeView"><span>⌂</span>推荐</button><button class="nav-item" data-goto="closetView"><span>♧</span>衣橱</button><button class="nav-item" data-goto="addView"><span>＋</span>添加</button></nav>
    </main>
    <dialog id="itemDialog"><button class="dialog-close" aria-label="关闭">×</button><div id="dialogContent"></div></dialog>
    <div class="toast" id="toast" role="status"></div>
    <script src="app.js?v=mobile-stable-1"></script>
  </body>
</html>
